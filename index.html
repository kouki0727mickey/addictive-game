<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07071a" />
    <title>ORBIT SWITCH</title>
    <meta name="description" content="A one-tap game you can’t put down. Switch rings, dodge spikes, grab gems. タップだけで遊べる中毒性ワンタップゲーム。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="game" data-i18n-aria="canvas.label"></canvas>

    <div id="hud" class="hidden">
      <div id="hud-best"></div>
      <div id="hud-score">0</div>
      <div id="hud-mult"></div>
      <div id="hud-fever" class="fever-meter"><i></i></div>
    </div>

    <section id="pause" class="screen hidden">
      <h2 data-i18n="pause.title"></h2>
      <button id="btn-resume" class="btn primary" data-i18n="pause.resume"></button>
      <p class="tagline" data-i18n="pause.hint"></p>
    </section>

    <section id="menu" class="screen">
      <h1 class="logo">ORBIT<span>SWITCH</span></h1>
      <p class="tagline" data-i18n-html="menu.tagline"></p>
      <div class="stats">
        <div>BEST <b id="menu-best">0</b></div>
        <div>🪙 <b id="menu-coins">0</b></div>
        <div>Lv <b id="menu-level">1</b></div>
      </div>
      <div class="xpbar"><i id="menu-xp"></i></div>
      <div id="daily" class="toast hidden"></div>
      <button id="btn-play" class="btn primary" data-i18n="menu.play"></button>
      <button id="btn-daily" class="btn daily"><span data-i18n="menu.daily"></span> <small id="daily-best"></small></button>
      <div class="row">
        <button id="btn-shop" class="btn" data-i18n="menu.skins"></button>
        <button id="btn-missions" class="btn" data-i18n="menu.missions"></button>
        <button id="btn-mute" class="btn icon" data-i18n-aria="menu.sound">🔊</button>
        <button id="btn-lang" class="btn icon" data-i18n-aria="menu.lang"></button>
      </div>
    </section>

    <section id="over" class="screen hidden">
      <div id="share-toast" class="toast hidden" role="status"></div>
      <div id="over-mode" class="mode-label hidden" data-i18n="over.daily"></div>
      <div id="over-newbest" class="newbest hidden">NEW BEST!</div>
      <div class="over-score" id="over-score" aria-live="polite">0</div>
      <div class="over-best">BEST <b id="over-best">0</b></div>
      <div id="over-tease" class="tease"></div>
      <ul id="over-details" class="details"></ul>
      <div id="over-unlock" class="unlock"></div>
      <div id="over-missions" class="missions"></div>
      <div class="row">
        <button id="btn-home" class="btn" data-i18n="over.menu"></button>
        <button id="btn-share" class="btn icon" data-i18n-aria="over.share">📤</button>
        <button id="btn-retry" class="btn primary" data-i18n="over.retry"></button>
      </div>
    </section>

    <section id="shop" class="screen hidden">
      <h2 data-i18n="shop.title"></h2>
      <div class="coins">🪙 <b id="shop-coins">0</b></div>
      <div id="shop-list" class="shop-list"></div>
      <p id="shop-msg" class="tagline" role="status"></p>
      <button class="btn btn-back" data-i18n="back"></button>
    </section>

    <section id="missions" class="screen hidden">
      <h2 data-i18n="missions.title"></h2>
      <div id="mission-list" class="missions"></div>
      <p id="lifetime" class="tagline"></p>
      <button class="btn btn-back" data-i18n="back"></button>
    </section>

    <script src="js/i18n.js"></script>
    <script src="js/core.js"></script>
    <script src="js/meta.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
